<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUNG FU 2100</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <span id="turn-display">Turn 1/10</span>
            <span id="phase-display" class="terminator">TERMINATOR MOVE 1</span>

            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="controls">
            <button id="endPhaseBtn">END PHASE</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
